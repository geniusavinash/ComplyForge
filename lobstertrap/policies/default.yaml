# ComplyForge baseline Lobster Trap policy.
#
# Schema source: github.com/veeainc/lobstertrap (verified by clone in Phase 7).
# This is a hand-written enterprise baseline that ComplyForge layers under
# every per-agent policy generated by PolicyAgent. The conditions reference
# Lobster Trap's built-in DPI metadata fields rather than reinventing regex
# patterns — the inspector already detects sk-..., AKIA..., ghp_..., bearer
# tokens, and API_KEY= shapes via `contains_credentials`, and the classic
# prompt-injection signatures via `contains_injection_patterns`.

version: "1.0"
policy_name: complyforge-default-baseline
default_action: ALLOW

ingress_rules:
  # 1. Block secret leaks in prompts (sk-..., AKIA..., ghp_/github_pat_...,
  #    API_KEY=, bearer-token shapes — all covered by the inspector's
  #    `contains_credentials` boolean).
  - name: block_secret_egress_in_prompt
    description: >-
      Prompt contains a credential / secret pattern (sk-..., AKIA[0-9A-Z]{16},
      ghp_/github_pat_..., API_KEY=, bearer ...). Blocked to satisfy
      EU AI Act Article 10 data-governance and Article 15 cybersecurity duties.
    priority: 110
    action: DENY
    deny_message: "[ComplyForge] Blocked: secret/credential detected in prompt."
    conditions:
      - field: contains_credentials
        match_type: boolean
        value: true

  # 2. Block classic prompt-injection signatures (case-insensitive matches for
  #    "ignore previous instructions", "disregard system prompt", "you are now ",
  #    DAN-style jailbreaks — the inspector flags these via
  #    `contains_injection_patterns`).
  - name: block_prompt_injection_signatures
    description: >-
      Prompt-injection signature detected (ignore previous instructions /
      disregard system prompt / you are now ...). Blocked under EU AI Act
      Article 15 cybersecurity controls.
    priority: 100
    action: DENY
    deny_message: "[ComplyForge] Blocked: prompt-injection signature."
    conditions:
      - field: contains_injection_patterns
        match_type: boolean
        value: true

  # 3. Log every request for Article 12 record-keeping. The inspector emits a
  #    non-negative `token_count` for every prompt, so this matches all traffic.
  - name: log_every_request
    description: >-
      Log all ingress traffic to satisfy EU AI Act Article 12 record-keeping
      and Article 72 post-market monitoring obligations.
    priority: 10
    action: LOG
    conditions:
      - field: token_count
        match_type: threshold
        value: 0

egress_rules:
  # 1. Block model output that leaks credentials (the inspector applies the
  #    same DPI on the egress side).
  - name: block_credential_leak_in_response
    description: >-
      Model output contains a credential / secret pattern. Blocked under
      EU AI Act Article 10 data-governance and Article 15 cybersecurity duties.
    priority: 110
    action: DENY
    deny_message: "[ComplyForge] Output blocked: credential leak detected."
    conditions:
      - field: contains_credentials
        match_type: boolean
        value: true

  # 2. Log every response for Article 12 record-keeping.
  - name: log_every_response
    description: >-
      Log all egress traffic to satisfy EU AI Act Article 12 record-keeping
      and Article 72 post-market monitoring obligations.
    priority: 10
    action: LOG
    conditions:
      - field: token_count
        match_type: threshold
        value: 0
